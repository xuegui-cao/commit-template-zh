name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify base input
        run: python tools/verify_jar.py --base tools/upstream/commit-template-idea-plugin-base-1.2.1.jar

      - name: Localize & package
        run: python tools/localize_jar.py --base tools/upstream/commit-template-idea-plugin-base-1.2.1.jar --out dist/commit-template-zh-1.2.1.jar

      - name: Verify build
        run: python tools/verify_jar.py --jar dist/commit-template-zh-1.2.1.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: dist/commit-template-zh-1.2.1.jar

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/commit-template-zh-1.2.1.jar
